; Kalos Dex firmware (PLAN.md). One code base, two builds:
;   pio run -e esp32dev -t upload --upload-port COM3   -> the gadget (Home, Clock, ...)
;   pio run -e hwtest   -t upload --upload-port COM3   -> + hardware-test screens (input, lights + strip
;                                                         calibration, edges, info, clock test) + POWERTEST
; Both use the same saved settings (own NVS partition "kalos"), so a calibration done in hwtest stays.
; Uploads work automatically on the home PC (100 uF on EN + %LOCALAPPDATA%\esptool\esptool.cfg).

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; partition table must keep otadata at 0xE000 (two app slots stay – harmless, OTA unused: USB only)
board_build.partitions = partitions.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit NeoPixel@^1.15.5
build_flags =
    -D FW_VERSION=\"0.7.0\"
    -I sprites              ; generated pet sprites (tools/sprite_convert.py, git-ignored; missing = placeholder blob)
    ; ---- TFT_eSPI set-up (instead of editing the library's User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1   ; touch is unused (screen sits behind the case face)
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1          ; no MISO: GPIO 19 is the yellow status LED
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=-1           ; display RESET is wired to the ESP32's EN pin
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000   ; could try 40 MHz now that it's in the case

[env:esp32dev]
build_src_filter = +<*> -<hwtest/>

[env:hwtest]
build_flags = ${env.build_flags} -D HWTEST=1
